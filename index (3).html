<script>
const STORAGE_KEY = 'karriere-daten';

// Speicher-Abstraktion: nutzt window.storage falls vorhanden (Claude-Vorschau),
// sonst localStorage (wenn die Datei lokal im Browser geöffnet wird).
const Store = {
  mode: 'none',
  init(){
    if(typeof window !== 'undefined' && window.storage && typeof window.storage.set === 'function'){
      this.mode = 'claude';
      return this.mode;
    }
    try{
      const probeKey = '__probe_' + Date.now();
      window.localStorage.setItem(probeKey, '1');
      window.localStorage.removeItem(probeKey);
      this.mode = 'local';
    }catch(e){
      this.mode = 'none';
    }
    return this.mode;
  },
  async get(key){
    if(this.mode === 'claude'){
      const res = await window.storage.get(key, false);
      return res && res.value ? res.value : null;
    }
    if(this.mode === 'local'){
      return window.localStorage.getItem(key);
    }
    return null;
  },
  async set(key, value){
    if(this.mode === 'claude'){
      const res = await window.storage.set(key, value, false);
      if(res === null || res === undefined) throw new Error('Speicher gab keine Bestätigung zurück');
      return true;
    }
    if(this.mode === 'local'){
      window.localStorage.setItem(key, value);
      return true;
    }
    throw new Error('kein Speicher verfügbar');
  }
};
const STATUS_OPTIONS = ["Recherche","Vorbereitung","Beworben","Interview","Angebot","Angenommen","Abgelehnt","Zurückgezogen"];

function clearDragOverStyles(table){
  table.querySelectorAll('tr.drag-over').forEach(el => el.classList.remove('drag-over'));
}

function recomputeNote(row){
  const tls = row.teilleistungen || [];
  if(!tls.length) return;
  const valid = tls.filter(t => t.gewichtung !== '' && t.note !== '' && !isNaN(parseFloat(t.gewichtung)) && !isNaN(parseFloat(t.note)));
  if(valid.length && valid.length === tls.length){
    const sumW = valid.reduce((s,t) => s + parseFloat(t.gewichtung), 0);
    if(sumW > 0){
      const weighted = valid.reduce((s,t) => s + parseFloat(t.gewichtung)*parseFloat(t.note), 0) / sumW;
      row.note = Math.round(weighted*100)/100;
      if(row.status === 'Geplant' || row.status === 'Angemeldet') row.status = 'Bestanden';
    }
  }
}

function statusClass(v){
  return "st-" + (v||"").toLowerCase()
    .replace("ä","ae").replace("ö","oe").replace("ü","ue")
    .replace(/[^a-z]/g,"");
}

function makeId(){
  return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
}

function emptyRow(section){
  const r = {};
  section.cols.forEach(c => {
    if(c.type==="status") r[c.k] = c.opts[0];
    else if(c.type==="checkbox") r[c.k] = false;
    else r[c.k] = "";
  });
  if(section.hasNotes){ r.id = makeId(); }
  return r;
}

function parseDateKey(str){
  if(!str) return Infinity;
  let s = str.trim();
  if(s === '–' || s === '-' || s.toLowerCase() === 'prüfen') return Infinity;
  let m = s.match(/\b(HS|FS)\s?(\d{2,4})\b/i);
  if(m){
    let yr = m[2].length===2 ? 2000+parseInt(m[2]) : parseInt(m[2]);
    let month = m[1].toUpperCase()==='HS' ? 9 : 2;
    return yr*372 + (month-1)*31 + 1;
  }
  const months = {jan:1,feb:2,'mär':3,maer:3,mar:3,apr:4,mai:5,may:5,jun:6,jul:7,aug:8,sep:9,okt:10,oct:10,nov:11,dez:12,dec:12};
  let monthMatch = null;
  for(const key in months){
    if(new RegExp('\\b'+key, 'i').test(s)){ monthMatch = months[key]; break; }
  }
  let yearMatch = s.match(/(20\d{2})/);
  if(!yearMatch) return Infinity;
  let year = parseInt(yearMatch[1]);
  let month = monthMatch || 6;
  return year*372 + (month-1)*31 + 1;
}

function parseExactDateKey(str){
  if(!str) return Infinity;
  const m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return Infinity;
  const year = parseInt(m[1]), month = parseInt(m[2]), day = parseInt(m[3]);
  return year*372 + (month-1)*31 + day;
}

function formatDateDisplay(str){
  const m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return str;
  return `${m[3]}.${m[2]}.${m[1]}`;
}

function buildTimelineEvents(){
  const events = [];
  (state.data.bewerbungen||[]).forEach(r => {
    if(r.deadline && r.deadline.trim() && r.deadline.trim() !== '–'){
      events.push({
        dateLabel: r.deadline, sortKey: parseDateKey(r.deadline),
        title: `Deadline: ${r.unternehmen || 'Unternehmen'} – ${r.rolle || ''}`,
        source: 'bewerbung', sourceLabel: 'Bewerbung', notes: r.notizen,
        statusRow: r, statusOptions: STATUS_OPTIONS, jumpKey: 'bewerbungen'
      });
    }
    if(r.start && r.start.trim()){
      const endLabel = r.ende && r.ende.trim() ? ` – ${formatDateDisplay(r.ende.trim())}` : '';
      events.push({
        dateLabel: formatDateDisplay(r.start.trim()) + endLabel,
        sortKey: parseExactDateKey(r.start.trim()),
        title: `Praktikum: ${r.unternehmen || ''}${r.rolle ? ' – ' + r.rolle : ''}`,
        source: 'bewerbung', sourceLabel: 'Praktikumszeitraum', notes: r.notizen,
        statusRow: r, statusOptions: STATUS_OPTIONS, jumpKey: 'bewerbungen'
      });
    }
  });
  (state.data.noten||[]).forEach(r => {
    if(r.kurs && r.kurs.trim() && ((r.datum && r.datum.trim()) || (r.semester && r.semester.trim()))){
      if(!r.status){ r.status = r.note ? "Bestanden" : "Geplant"; }
      const hasExact = r.datum && r.datum.trim();
      events.push({
        dateLabel: hasExact ? formatDateDisplay(r.datum.trim()) : r.semester,
        sortKey: hasExact ? parseExactDateKey(r.datum.trim()) : parseDateKey(r.semester),
        title: `Prüfung: ${r.kurs}`,
        source: 'pruefung', sourceLabel: 'Prüfung', notes: r.note ? `Note ${r.note}` : (r.bereich && r.bereich !== '–' ? r.bereich : ''),
        statusRow: r, statusOptions: NOTEN_STATUS, jumpKey: 'noten'
      });
    }
  });
  (state.data.uni||[]).forEach(r => {
    if(r.frist && r.frist.trim() && r.frist.trim().toLowerCase() !== 'prüfen'){
      events.push({
        dateLabel: r.frist, sortKey: parseDateKey(r.frist),
        title: `Bewerbungsfrist: ${r.programm || ''} (${r.uni || ''})`,
        source: 'uni', sourceLabel: 'Uniplanung', notes: r.notizen,
        statusRow: null, jumpKey: 'uni'
      });
    }
  });
  (state.data.todos||[]).forEach(r => {
    if(r.frist && r.frist.trim() && r.aufgabe && r.aufgabe.trim()){
      events.push({
        dateLabel: r.frist, sortKey: parseDateKey(r.frist),
        title: r.aufgabe,
        source: 'todo', sourceLabel: r.kategorie || 'To-Do', notes: r.notizen,
        statusRow: null, statusText: r.erledigt ? 'Erledigt' : 'Offen', jumpKey: 'todos'
      });
    }
  });
  (state.data.timeline||[]).forEach((r, idx) => {
    events.push({
      dateLabel: r.zeitraum, sortKey: parseDateKey(r.zeitraum),
      title: r.titel, source: 'manuell', sourceLabel: r.kategorie || 'Eigener Eintrag',
      notes: r.notizen, statusRow: r, statusOptions: TIMELINE_STATUS,
      editableTitle:true, refIdx: idx
    });
  });
  events.sort((a,b) => a.sortKey - b.sortKey);
  return events;
}

function tabIndexForKey(key){
  return SECTIONS.findIndex(s => s.key === key);
}

function renderTimelinePanel(panel){
  const events = buildTimelineEvents();
  const dated = events.filter(e => e.sortKey !== Infinity);
  const undated = events.filter(e => e.sortKey === Infinity);

  const legend = document.createElement('div');
  legend.className = 'tl-legend';
  legend.innerHTML = `
    <span class="item"><span class="dot" style="background:var(--gold)"></span>Bewerbung</span>
    <span class="item"><span class="dot" style="background:var(--steel)"></span>Prüfung</span>
    <span class="item"><span class="dot" style="background:var(--rust)"></span>Uniplanung</span>
    <span class="item"><span class="dot" style="background:var(--slate)"></span>Eigener Eintrag</span>
    <span class="item"><span class="dot" style="background:var(--plum)"></span>To-Do</span>
  `;
  panel.appendChild(legend);

  function renderList(list){
    const tl = document.createElement('div');
    tl.className = 'tl';
    list.forEach(ev => {
      const item = document.createElement('div');
      item.className = 'tl-item';
      const dotColor = {bewerbung:'var(--gold)', pruefung:'var(--steel)', uni:'var(--rust)', manuell:'var(--slate)', todo:'var(--plum)'}[ev.source];
      const dateEl = document.createElement('div');
      dateEl.className = 'tl-date';
      if(ev.editableTitle){
        dateEl.contentEditable = "true";
        dateEl.textContent = ev.dateLabel || '';
        dateEl.oninput = () => { state.data.timeline[ev.refIdx].zeitraum = dateEl.textContent; save(); };
      } else {
        dateEl.textContent = ev.dateLabel || '';
      }
      const dot = document.createElement('div');
      dot.className = 'tl-dot';
      dot.style.background = dotColor;
      item.appendChild(dot);
      item.appendChild(dateEl);

      const titleEl = document.createElement('div');
      titleEl.className = 'tl-title';
      if(ev.editableTitle){
        titleEl.contentEditable = "true";
        titleEl.textContent = ev.title || '';
        titleEl.oninput = () => { state.data.timeline[ev.refIdx].titel = titleEl.textContent; save(); };
      } else {
        titleEl.textContent = ev.title || '';
      }
      item.appendChild(titleEl);

      const meta = document.createElement('div');
      meta.className = 'tl-meta';
      const srcTag = document.createElement('span');
      srcTag.className = 'tl-source src-' + ev.source;
      srcTag.textContent = ev.sourceLabel || '';
      meta.appendChild(srcTag);

      if(ev.statusRow && ev.statusOptions){
        const statusSel = document.createElement('select');
        statusSel.className = 'cellsel stamp ' + statusClass(ev.statusRow.status);
        statusSel.title = 'Status ändern – wirkt sich direkt auf ' + (ev.jumpKey||'') + ' aus';
        statusSel.style.width = 'auto';
        ev.statusOptions.forEach(o => {
          const opt = document.createElement('option');
          opt.value = o; opt.textContent = o;
          if(ev.statusRow.status === o) opt.selected = true;
          statusSel.appendChild(opt);
        });
        statusSel.onchange = () => {
          ev.statusRow.status = statusSel.value;
          statusSel.className = 'cellsel stamp ' + statusClass(statusSel.value);
          save();
        };
        meta.appendChild(statusSel);
      } else if(ev.statusText){
        const stampTag = document.createElement('span');
        stampTag.className = 'stamp ' + statusClass(ev.statusText === 'Erledigt' ? 'Erledigt' : 'Geplant');
        stampTag.textContent = ev.statusText;
        meta.appendChild(stampTag);
      }

      if(ev.jumpKey){
        const jump = document.createElement('button');
        jump.className = 'tl-jump';
        jump.textContent = 'weitere Felder bearbeiten →';
        jump.onclick = () => { state.activeTab = tabIndexForKey(ev.jumpKey); render(); };
        meta.appendChild(jump);
      }
      if(ev.editableTitle){
        const delBtn = document.createElement('button');
        delBtn.className = 'del';
        delBtn.innerHTML = '✕';
        delBtn.title = 'Eintrag löschen';
        delBtn.onclick = () => { state.data.timeline.splice(ev.refIdx,1); save(); render(); };
        meta.appendChild(delBtn);
      }
      item.appendChild(meta);

      if(ev.notes){
        const notes = document.createElement('div');
        notes.className = 'tl-notes';
        notes.textContent = ev.notes;
        item.appendChild(notes);
      }
      tl.appendChild(item);
    });
    panel.appendChild(tl);
  }

  renderList(dated);
  if(undated.length){
    const label = document.createElement('div');
    label.className = 'tl-undated-label';
    label.textContent = 'Ohne festes Datum';
    panel.appendChild(label);
    renderList(undated);
  }

  const actions = document.createElement('div');
  actions.className = 'row-actions';
  const addBtn = document.createElement('button');
  addBtn.textContent = '+ Eigener Eintrag';
  addBtn.onclick = () => {
    state.data.timeline.push({zeitraum:'', titel:'Neuer Eintrag', kategorie:'', status:'Geplant', notizen:''});
    save(); render();
  };
  actions.appendChild(addBtn);
  panel.appendChild(actions);
}

function getLabel(section){
  return (state.labels && state.labels[section.key]) || section.label;
}

function statusFillVar(status){
  const map = {
    "Recherche":"--slate-fill", "Vorbereitung":"--slate-fill",
    "Beworben":"--blue-fill", "Interview":"--gold-fill",
    "Angebot":"--emerald-fill", "Angenommen":"--emerald-fill",
    "Abgelehnt":"--rust-fill", "Zurückgezogen":"--rust-fill"
  };
  return map[status] || null;
}

function render(){
  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('panels');
  tabsEl.innerHTML = "";
  panelsEl.innerHTML = "";
  state.labels = state.labels || {};
  SECTIONS.forEach((section, si) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (si===state.activeTab ? ' active' : '');
    tab.textContent = getLabel(section);
    tab.onclick = () => { state.activeTab = si; render(); };
    tabsEl.appendChild(tab);

    const panel = document.createElement('section');
    panel.className = 'panel' + (si===state.activeTab ? ' active' : '');
    const h2 = document.createElement('h2');
    h2.contentEditable = "true";
    h2.spellcheck = false;
    h2.title = 'Klicken zum Umbenennen';
    h2.textContent = getLabel(section);
    h2.oninput = () => {
      const val = h2.textContent.trim();
      state.labels[section.key] = val || section.label;
      tab.textContent = state.labels[section.key];
      save();
    };
    panel.appendChild(h2);
    if(section.desc){
      const descP = document.createElement('p');
      descP.className = 'desc';
      descP.textContent = section.desc;
      panel.appendChild(descP);
    } else {
      h2.style.marginBottom = '14px';
    }

    if(section.isTimeline){
      renderTimelinePanel(panel);
      panelsEl.appendChild(panel);
      return;
    }

    if(section.isNotes){
      const ta = document.createElement('textarea');
      ta.value = state.freeNotes || '';
      ta.placeholder = 'Hier reinschreiben, was dir einfällt – Ideen, Gesprächsnotizen, offene Fragen…';
      ta.style.cssText = 'width:100%;min-height:420px;font-family:\'IBM Plex Sans\',sans-serif;font-size:14px;line-height:1.6;border:1px solid var(--line);border-radius:6px;padding:14px 16px;background:var(--paper-2);color:var(--ink);resize:vertical;outline:none;box-sizing:border-box;';
      ta.onfocus = () => { ta.style.borderColor = 'var(--gold)'; };
      ta.onblur = () => { ta.style.borderColor = 'var(--line)'; };
      ta.oninput = () => { state.freeNotes = ta.value; save(); };
      panel.appendChild(ta);
      panelsEl.appendChild(panel);
      return;
    }

    const table = document.createElement('table');
    const thead = document.createElement('tr');
    section.cols.forEach(c => {
      const th = document.createElement('th');
      th.style.width = c.w;
      th.textContent = c.label;
      thead.appendChild(th);
    });
    if(section.hasNotes){
      const thNotes = document.createElement('th');
      thNotes.style.width = '3%';
      thNotes.textContent = '';
      thead.appendChild(thNotes);
    }
    if(section.hasSubgrades){
      const thTeil = document.createElement('th');
      thTeil.style.width = '3%';
      thTeil.textContent = '';
      thead.appendChild(thTeil);
    }
    if(section.reorder){
      const thMove = document.createElement('th');
      thMove.style.width = '5%';
      thMove.textContent = '';
      thead.appendChild(thMove);
    }
    thead.appendChild(document.createElement('th'));
    table.appendChild(thead);

    const rows = state.data[section.key];
    rows.forEach((row, ri) => {
      if(section.hasNotes && !row.id){ row.id = makeId(); }
      if(section.hasSubgrades && !row.id){ row.id = makeId(); }
      const tr = document.createElement('tr');
      if(section.key === 'todos' && row.erledigt) tr.className = 'done-row';
      if(section.key === 'bewerbungen'){
        const fillVar = statusFillVar(row.status);
        if(fillVar) tr.style.background = `var(${fillVar})`;
        tr.style.fontStyle = row.track === 'Consulting' ? 'italic' : 'normal';
      }
      let statusSelEl = null;
      section.cols.forEach(c => {
        const td = document.createElement('td');
        if(c.type === "status"){
          const sel = document.createElement('select');
          sel.className = 'cellsel';
          c.opts.forEach(o => {
            const opt = document.createElement('option');
            opt.value = o; opt.textContent = o;
            if(row[c.k] === o) opt.selected = true;
            sel.appendChild(opt);
          });
          sel.onchange = () => {
            row[c.k] = sel.value;
            save();
            renderBadgeWrap(td, sel, row[c.k]);
            if(section.metric) updateMetric(section, panel);
            if(section.key === 'bewerbungen' && c.k === 'status'){
              const fillVar = statusFillVar(row.status);
              tr.style.background = fillVar ? `var(${fillVar})` : '';
            }
            if(section.key === 'bewerbungen' && c.k === 'track'){
              tr.style.fontStyle = row.track === 'Consulting' ? 'italic' : 'normal';
            }
          };
          renderBadgeWrap(td, sel, row[c.k]);
          if(c.k === 'status') statusSelEl = sel;
        } else if(c.type === "checkbox"){
          td.style.textAlign = 'center';
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = !!row[c.k];
          cb.onchange = () => { row[c.k] = cb.checked; save(); if(section.metric) updateMetric(section, panel); render(); };
          td.appendChild(cb);
        } else if(c.type === "date"){
          const inp = document.createElement('input');
          inp.type = 'date';
          inp.value = row[c.k] || '';
          inp.style.cssText = 'border:none;background:transparent;font-family:inherit;font-size:12.5px;color:var(--ink);width:100%;padding:2px;';
          inp.onchange = () => { row[c.k] = inp.value; save(); if(section.metric) updateMetric(section, panel); };
          td.appendChild(inp);
        } else {
          td.contentEditable = "true";
          td.textContent = row[c.k] || "";
          td.oninput = () => {
            row[c.k] = td.textContent;
            if(section.key === 'noten' && c.k === 'note'){
              const val = td.textContent.trim();
              if(val && (row.status === 'Geplant' || row.status === 'Angemeldet')){
                row.status = 'Bestanden';
                if(statusSelEl){ statusSelEl.value = 'Bestanden'; statusSelEl.className = 'cellsel stamp ' + statusClass('Bestanden'); }
              }
            }
            save();
            if(section.metric) updateMetric(section, panel);
          };
        }
        tr.appendChild(td);
      });
      if(section.hasNotes){
        const tdNotesToggle = document.createElement('td');
        const notesBtn = document.createElement('button');
        notesBtn.className = 'notes-toggle' + (expandedNotes.has(row.id) ? ' on' : '');
        notesBtn.innerHTML = '<i class="ti ti-notes"></i>';
        notesBtn.textContent = '✎';
        notesBtn.title = 'Ausführliche Notizen';
        notesBtn.onclick = () => {
          if(expandedNotes.has(row.id)) expandedNotes.delete(row.id); else expandedNotes.add(row.id);
          render();
        };
        tdNotesToggle.appendChild(notesBtn);
        tr.appendChild(tdNotesToggle);
      }
      if(section.hasSubgrades){
        const tdTeilToggle = document.createElement('td');
        const teilBtn = document.createElement('button');
        const tlCount = (row.teilleistungen||[]).length;
        teilBtn.className = 'notes-toggle' + (expandedTeil.has(row.id) ? ' on' : '');
        teilBtn.textContent = tlCount ? `%(${tlCount})` : '%';
        teilBtn.title = 'Teilleistungen (z.B. 20% Quiz, 80% Prüfung)';
        teilBtn.style.fontSize = '10.5px';
        teilBtn.onclick = () => {
          if(expandedTeil.has(row.id)) expandedTeil.delete(row.id); else expandedTeil.add(row.id);
          render();
        };
        tdTeilToggle.appendChild(teilBtn);
        tr.appendChild(tdTeilToggle);
      }
      if(section.reorder){
        const tdMove = document.createElement('td');
        tdMove.style.whiteSpace = 'nowrap';
        const grip = document.createElement('span');
        grip.className = 'drag-handle';
        grip.innerHTML = '⠿';
        grip.title = 'Ziehen zum Verschieben';
        grip.draggable = true;
        grip.ondragstart = (e) => {
          dragCtx = { key: section.key, index: ri };
          e.dataTransfer.effectAllowed = 'move';
          try{ e.dataTransfer.setData('text/plain', String(ri)); }catch(err){}
        };
        grip.ondragend = () => { dragCtx = null; clearDragOverStyles(table); };
        const upBtn = document.createElement('button');
        upBtn.className = 'del'; upBtn.innerHTML = '↑'; upBtn.title = 'Nach oben verschieben';
        upBtn.disabled = ri === 0;
        upBtn.style.opacity = ri === 0 ? '0.3' : '1';
        upBtn.onclick = () => { if(ri>0){ [rows[ri-1], rows[ri]] = [rows[ri], rows[ri-1]]; save(); render(); } };
        const downBtn = document.createElement('button');
        downBtn.className = 'del'; downBtn.innerHTML = '↓'; downBtn.title = 'Nach unten verschieben';
        downBtn.disabled = ri === rows.length-1;
        downBtn.style.opacity = ri === rows.length-1 ? '0.3' : '1';
        downBtn.onclick = () => { if(ri<rows.length-1){ [rows[ri+1], rows[ri]] = [rows[ri], rows[ri+1]]; save(); render(); } };
        tdMove.appendChild(grip);
        tdMove.appendChild(upBtn);
        tdMove.appendChild(downBtn);
        tr.appendChild(tdMove);

        tr.ondragover = (e) => {
          if(!dragCtx || dragCtx.key !== section.key) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          clearDragOverStyles(table);
          tr.classList.add('drag-over');
        };
        tr.ondragleave = () => { tr.classList.remove('drag-over'); };
        tr.ondrop = (e) => {
          if(!dragCtx || dragCtx.key !== section.key) return;
          e.preventDefault();
          clearDragOverStyles(table);
          const from = dragCtx.index;
          if(from !== ri){
            const item = rows.splice(from, 1)[0];
            const to = from < ri ? ri - 1 : ri;
            rows.splice(to, 0, item);
            save(); render();
          }
          dragCtx = null;
        };
      }
      const tdDel = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.className = 'del';
      delBtn.innerHTML = '✕';
      delBtn.title = 'Zeile löschen';
      delBtn.onclick = async () => {
        if(section.hasNotes) expandedNotes.delete(row.id);
        rows.splice(ri,1); save(); render();
      };
      tdDel.appendChild(delBtn);
      tr.appendChild(tdDel);
      table.appendChild(tr);

      const extraCols = (section.hasNotes?1:0) + (section.hasSubgrades?1:0) + (section.reorder?1:0) + 1;

      if(section.hasNotes && expandedNotes.has(row.id)){
        const notesTr = document.createElement('tr');
        notesTr.className = 'notes-row';
        const notesTd = document.createElement('td');
        notesTd.colSpan = section.cols.length + extraCols;
        const label = document.createElement('div');
        label.className = 'notes-label';
        label.textContent = `Ausführliche Notizen – ${row.unternehmen || 'Unternehmen'}`;
        const textarea = document.createElement('textarea');
        textarea.value = row.notizenLang || '';
        textarea.placeholder = 'z.B. Gesprächsnotizen, Interview-Vorbereitung, Kontaktpersonen, Eindrücke...';
        textarea.oninput = () => { row.notizenLang = textarea.value; save(); };
        notesTd.appendChild(label);
        notesTd.appendChild(textarea);
        notesTr.appendChild(notesTd);
        table.appendChild(notesTr);
      }

      if(section.hasSubgrades && expandedTeil.has(row.id)){
        row.teilleistungen = row.teilleistungen || [];
        const teilTr = document.createElement('tr');
        teilTr.className = 'teil-row';
        const teilTd = document.createElement('td');
        teilTd.colSpan = section.cols.length + extraCols;
        const label = document.createElement('div');
        label.className = 'notes-label';
        label.textContent = `Teilleistungen – ${row.kurs || 'Kurs'}`;
        teilTd.appendChild(label);

        const teilTable = document.createElement('table');
        teilTable.className = 'teil-table';
        const teilHead = document.createElement('tr');
        ['Bezeichnung','Gewichtung (%)','Note',''].forEach(h => {
          const th = document.createElement('th');
          th.textContent = h;
          th.style.textAlign = 'left';
          teilHead.appendChild(th);
        });
        teilTable.appendChild(teilHead);

        row.teilleistungen.forEach((t, ti) => {
          const tRow = document.createElement('tr');
          const tdB = document.createElement('td');
          const inpB = document.createElement('input');
          inpB.type = 'text'; inpB.value = t.bezeichnung || ''; inpB.placeholder = 'z.B. Quiz';
          inpB.onchange = () => { t.bezeichnung = inpB.value; save(); };
          tdB.appendChild(inpB);
          const tdW = document.createElement('td');
          const inpW = document.createElement('input');
          inpW.type = 'number'; inpW.value = t.gewichtung || ''; inpW.placeholder = '20';
          inpW.onchange = () => { t.gewichtung = inpW.value; recomputeNote(row); save(); render(); };
          tdW.appendChild(inpW);
          const tdN = document.createElement('td');
          const inpN = document.createElement('input');
          inpN.type = 'number'; inpN.value = t.note || ''; inpN.placeholder = '5.5';
          inpN.onchange = () => { t.note = inpN.value; recomputeNote(row); save(); render(); };
          tdN.appendChild(inpN);
          const tdX = document.createElement('td');
          const xBtn = document.createElement('button');
          xBtn.className = 'del'; xBtn.innerHTML = '✕'; xBtn.title = 'Teilleistung löschen';
          xBtn.onclick = () => { row.teilleistungen.splice(ti,1); recomputeNote(row); save(); render(); };
          tdX.appendChild(xBtn);
          tRow.appendChild(tdB); tRow.appendChild(tdW); tRow.appendChild(tdN); tRow.appendChild(tdX);
          teilTable.appendChild(tRow);
        });
        teilTd.appendChild(teilTable);

        const addTeilBtn = document.createElement('button');
        addTeilBtn.className = 'ghost';
        addTeilBtn.style.cssText = 'font-size:11px;padding:4px 10px;margin-top:8px;';
        addTeilBtn.textContent = '+ Teilleistung';
        addTeilBtn.onclick = () => { row.teilleistungen.push({bezeichnung:'', gewichtung:'', note:''}); save(); render(); };
        teilTd.appendChild(addTeilBtn);

        const validW = row.teilleistungen.filter(t => t.gewichtung !== '' && !isNaN(parseFloat(t.gewichtung)));
        const sumW = validW.reduce((s,t) => s+parseFloat(t.gewichtung), 0);
        if(row.teilleistungen.length){
          const summary = document.createElement('div');
          summary.className = 'teil-summary';
          summary.textContent = `Gewichtungssumme: ${sumW}% ${sumW !== 100 && validW.length===row.teilleistungen.length ? '(ergibt nicht 100 % – Gesamtnote wird trotzdem anteilig berechnet)' : ''}`;
          teilTd.appendChild(summary);
        }

        teilTr.appendChild(teilTd);
        table.appendChild(teilTr);
      }
    });

    panel.appendChild(table);

    const actions = document.createElement('div');
    actions.className = 'row-actions';
    const addBtn = document.createElement('button');
    addBtn.textContent = '+ Zeile hinzufügen';
    addBtn.onclick = () => { rows.push(emptyRow(section)); save(); render(); };
    actions.appendChild(addBtn);
    panel.appendChild(actions);

    if(section.metric){
      const m = document.createElement('div');
      m.className = 'metric';
      m.id = 'metric-' + section.key;
      panel.appendChild(m);
      updateMetric(section, panel);
    }

    panelsEl.appendChild(panel);
  });
}

function renderBadgeWrap(td, selectEl, value){
  td.innerHTML = "";
  selectEl.className = 'cellsel stamp ' + statusClass(value);
  td.appendChild(selectEl);
}

function updateMetric(section, panel){
  const rows = state.data[section.key];
  const el = panel.querySelector('#metric-' + section.key) || document.getElementById('metric-' + section.key);
  if(!el) return;

  if(section.metric === "todos"){
    const total = rows.length;
    const done = rows.filter(r => r.erledigt).length;
    el.innerHTML = `<b>${done} von ${total}</b> Aufgaben erledigt`;
    return;
  }

  let sumWeighted = 0, sumEcts = 0, totalEcts = 0;
  let bestanden = 0, geplant = 0, nichtBestanden = 0;
  rows.forEach(r => {
    const ects = parseFloat(r.ects);
    const note = parseFloat(r.note);
    if(!isNaN(ects)) totalEcts += ects;
    const status = r.status || (r.note ? "Bestanden" : "Geplant");
    if(status === "Bestanden"){
      bestanden++;
      if(!isNaN(ects) && !isNaN(note)){ sumWeighted += ects*note; sumEcts += ects; }
    } else if(status === "Nicht bestanden"){
      nichtBestanden++;
    } else {
      geplant++;
    }
  });
  const avg = sumEcts > 0 ? (sumWeighted/sumEcts).toFixed(2) : "–";
  let txt = `Ø gewichteter Schnitt (bestanden): <b>${avg}</b> · ${sumEcts} ECTS bestanden · Gesamt aller Einträge: <b>${totalEcts} ECTS</b> · ${bestanden} bestanden`;
  if(geplant) txt += ` · ${geplant} geplant/angemeldet`;
  if(nichtBestanden) txt += ` · ${nichtBestanden} nicht bestanden`;
  el.innerHTML = txt;

  if(section.key === 'noten') renderCreditOverview(rows, panel);
}

function renderCreditOverview(rows, panel){
  let box = panel.querySelector('#creditBox');
  if(!box){
    box = document.createElement('div');
    box.id = 'creditBox';
    box.className = 'credit-box';
    panel.appendChild(box);
  }

  const bestandenBy = {}, geplantBy = {};
  BEREICH_OPTIONS.forEach(b => { bestandenBy[b] = 0; geplantBy[b] = 0; });
  rows.forEach(r => {
    const e = parseFloat(r.ects);
    if(isNaN(e)) return;
    const b = r.bereich && bestandenBy.hasOwnProperty(r.bereich) ? r.bereich : '–';
    if(r.status === 'Bestanden') bestandenBy[b] += e; else if(r.status !== 'Nicht bestanden') geplantBy[b] += e;
  });

  let html = '<div class="credit-title">Credit-Übersicht nach Bereich</div>';
  const gruppen = {};
  CREDIT_RULES.forEach(rule => {
    (gruppen[rule.gruppe] = gruppen[rule.gruppe] || []).push(rule);
  });

  Object.keys(gruppen).forEach(g => {
    let gBest = 0, gPlan = 0;
    gruppen[g].forEach(rule => { gBest += bestandenBy[rule.bereich]; gPlan += geplantBy[rule.bereich]; });
    const gTotal = GRUPPEN_TOTAL[g];
    html += `<div class="credit-group"><div class="credit-group-head">${g} <span>${gBest}${gPlan?` (+${gPlan} geplant)`:''} / ${gTotal} ECTS</span></div>`;
    gruppen[g].forEach(rule => {
      const done = bestandenBy[rule.bereich];
      const plan = geplantBy[rule.bereich];
      const target = rule.max;
      const pctDone = Math.min(100, (done/target)*100);
      const pctPlan = Math.min(100 - pctDone, (plan/target)*100);
      let statusTxt, statusCls;
      if(done + plan > rule.max){ statusTxt = `über Maximum (${rule.max})`; statusCls = 'cr-over'; }
      else if(done >= rule.min && rule.min > 0){ statusTxt = 'Minimum erfüllt'; statusCls = 'cr-ok'; }
      else if(rule.min === 0){ statusTxt = `0–${rule.max} möglich`; statusCls = 'cr-neutral'; }
      else { statusTxt = `noch ${Math.max(0, rule.min - done - plan)} bis Minimum`; statusCls = 'cr-open'; }
      html += `<div class="credit-row">
        <div class="credit-label">${rule.bereich}<span class="credit-range">${rule.min===rule.max?rule.min:rule.min+'–'+rule.max} ECTS</span></div>
        <div class="credit-bar"><div class="cb-done" style="width:${pctDone}%"></div><div class="cb-plan" style="width:${pctPlan}%"></div></div>
        <div class="credit-num">${done}${plan?` (+${plan})`:''}</div>
        <div class="credit-status ${statusCls}">${statusTxt}</div>
      </div>`;
    });
    html += '</div>';
  });

  const unz = bestandenBy['–'] + geplantBy['–'];
  if(unz){
    html += `<div class="credit-note"><b>${unz} ECTS ohne Bereich</b> – bitte in der Spalte "Bereich" zuordnen.</div>`;
  }

  box.innerHTML = html;
}

let saveTimeout = null;
function save(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    if(Store.mode === 'none'){
      showSaveError('Nicht gespeichert – bitte "Sicherung ↓" nutzen.');
      return;
    }
    try{
      await Store.set(STORAGE_KEY, JSON.stringify(state));
      flashSaved();
    }catch(e){
      showSaveError('Speichern fehlgeschlagen: ' + (e && e.message ? e.message : 'unbekannt'));
    }
  }, 400);
}

function showSaveError(text){
  const note = document.getElementById('saveNote');
  note.textContent = '⚠ ' + text;
  note.style.background = 'var(--rust-fill)';
  note.style.color = 'var(--rust)';
  note.style.borderColor = 'var(--rust)';
  note.style.maxWidth = '340px';
  note.classList.add('show');
  clearTimeout(flashSaved._t);
}

function flashSaved(){
  const note = document.getElementById('saveNote');
  note.textContent = 'gespeichert';
  note.style.background = '';
  note.style.color = '';
  note.style.borderColor = '';
  note.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(() => note.classList.remove('show'), 1200);
}

function titleExists(list, title){
  return list.some(r => (r.titel||'').trim() === title.trim());
}

    state.migrations.v2 = true;
    state.migrations.v3 = true;

    state.migrations.v5 = true;

  }

      {zeitraum:"Sep. 2025–März 2026", titel:"START Global – Summit Program Team", kategorie:"Leadership", status:"Erledigt", notizen:"Outreach zu internationalen Foundern und VCs für Speaker"},
      {zeitraum:"Herbst 2025", titel:"3. Platz HSG Innovation Trophy", kategorie:"Wettbewerb", status:"Erledigt", notizen:"Case zu IT-Implementierung bei CHG-Meridian"},
      {zeitraum:"Mai 2026–heute", titel:"START Global – Head of Summit Program", kategorie:"Leadership", status:"Läuft", notizen:"Speaker-Akquise, Bühnenprogramm, START Summit 2027"},
    ];

    state.data.bewerbungen = state.data.bewerbungen || [];
    const bainMentoring = "BAINsight Mentoring Zürich";
    if(!state.data.bewerbungen.some(r => (r.rolle||'').trim() === bainMentoring)){
      state.data.bewerbungen.push({unternehmen:"Bain & Company", rolle:bainMentoring, bereich:"Consulting", status:"Angenommen", deadline:"Feb. 2026", naechster:"Programm bis Okt. 2026", notizen:"Case Workshops, Partner Sessions, 1:1 Mentoring"});
    }
    state.data.bewerbungen.forEach(r => { if(!r.id){ r.id = makeId(); } });

    state.migrations.v2 = true;
    save();
  }
  if(!state.migrations.v3){
    const praktikum2 = [
      {unternehmen:"Saxenhammer", bereich:"M&A / Corporate Finance (Boutique)"},
      {unternehmen:"Zumera", bereich:"prüfen"},
      {unternehmen:"Carlsquare", bereich:"M&A Advisory"},
      {unternehmen:"Citi", bereich:"Investment Banking"},
      {unternehmen:"Partners Group", bereich:"Private Equity"},
      {unternehmen:"Big4 Transactions", bereich:"Transaction Services (Big4)"},
      {unternehmen:"Accenture Strategy", bereich:"Consulting"},
      {unternehmen:"Strategy&", bereich:"Consulting (PwC)"},
      {unternehmen:"Porsche Consulting", bereich:"Consulting"},
      {unternehmen:"Roland Berger", bereich:"Consulting"},
      {unternehmen:"Simon-Kucher", bereich:"Consulting"},
      {unternehmen:"UBS", bereich:"Investment Banking"},
      {unternehmen:"FalkenSteg", bereich:"Restructuring / M&A"},
      {unternehmen:"Nomura", bereich:"Investment Banking"},
      {unternehmen:"HSBC", bereich:"Investment Banking"},
      {unternehmen:"Deutsche Bank", bereich:"Investment Banking"},
      {unternehmen:"EQT", bereich:"Private Equity"},
      {unternehmen:"DWS", bereich:"Asset Management"},
      {unternehmen:"TTE Strategy", bereich:"prüfen"},
      {unternehmen:"Triton", bereich:"Private Equity"},
      {unternehmen:"Permira", bereich:"Private Equity"},
    ];
    state.data.bewerbungen = state.data.bewerbungen || [];
    praktikum2.forEach(p => {
      const already = state.data.bewerbungen.some(r => (r.unternehmen||'').trim().toLowerCase() === p.unternehmen.toLowerCase());
      if(!already){
        state.data.bewerbungen.push({
          id: makeId(), unternehmen:p.unternehmen, rolle:"Praktikum", bereich:p.bereich,
          status:"Recherche", deadline:"–", naechster:"Bewerbung vorbereiten",

    state.migrations.v3 = true;
    save();
  }
  if(!state.migrations.v4){
    state.data.todos = state.data.todos || [];
    const defaults = [
      {erledigt:false, aufgabe:"GMAT vorbereiten & ablegen", kategorie:"Master-Bewerbung", frist:"~2029", notizen:"Zielscore recherchieren, Prep-Kurs/Material auswählen"},
      {erledigt:false, aufgabe:"Cambridge Certificate (z.B. CAE/CPE)", kategorie:"Sprachzertifikat", frist:"", notizen:""},

}

function escapeCsv(v){
  v = (v===undefined||v===null) ? '' : String(v);
  if(/[",\n]/.test(v)){ v = '"' + v.replace(/"/g,'""') + '"'; }
  return v;
}

function buildCsv(){
  const lines = [];
  SECTIONS.forEach(section => {
    lines.push(getLabel(section));
    if(section.isNotes){
      lines.push('Notiztext');
      lines.push(escapeCsv(state.freeNotes || ''));
      lines.push('');
      return;
    }
    if(section.isTimeline){
      lines.push(['Datum','Titel','Kategorie / Quelle','Status','Notizen'].map(escapeCsv).join(','));
      buildTimelineEvents().forEach(ev => {
        lines.push([ev.dateLabel, ev.title, ev.sourceLabel, ev.status||'', ev.notes||''].map(escapeCsv).join(','));
      });
      lines.push('');
      return;
    }
    const headers = section.cols.map(c => c.label);
    if(section.hasNotes){ headers.push('Ausführliche Notizen'); }
    lines.push(headers.map(escapeCsv).join(','));
    (state.data[section.key]||[]).forEach(row => {
      const vals = section.cols.map(c => row[c.k]);
      if(section.hasNotes){ vals.push(row.notizenLang || ''); }
      lines.push(vals.map(escapeCsv).join(','));
    });
    lines.push('');
  });
  return lines.join('\r\n');
}

function exportCsv(){
  const csv = buildCsv();
  const blob = new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(state.appTitle||'organization').toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function init(){
  document.getElementById('today').textContent =
    new Date().toLocaleDateString('de-DE', {weekday:'long', year:'numeric', month:'long', day:'numeric'});

  const defaultData = {};
  SECTIONS.forEach(s => defaultData[s.key] = JSON.parse(JSON.stringify(s.rows)));

  Store.init();

  try{
    const raw = await Store.get(STORAGE_KEY);
    if(raw){
      state = JSON.parse(raw);
      SECTIONS.forEach(s => { if(!state.data[s.key]) state.data[s.key] = []; });
    } else {
      state = { activeTab: 0, data: defaultData };
    }
  }catch(e){
    state = { activeTab: 0, data: defaultData };
  }
  (state.data.noten||[]).forEach(r => { if(!r.status){ r.status = r.note ? "Bestanden" : "Geplant"; } });
  migrate();
  render();
  document.getElementById('exportBtn').onclick = exportCsv;

  document.getElementById('backupBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `organization-sicherung-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const restoreInput = document.getElementById('restoreInput');
  document.getElementById('restoreBtn').onclick = () => restoreInput.click();
  restoreInput.onchange = () => {
    const f = restoreInput.files && restoreInput.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(String(reader.result));
        if(!parsed || !parsed.data) throw new Error('Datei enthält keine gültige Sicherung');
        state = parsed;
        SECTIONS.forEach(s => { if(!state.data[s.key]) state.data[s.key] = []; });
        save(); render();
        flashSaved();
      }catch(e){
        showSaveError('Sicherung konnte nicht gelesen werden: ' + (e.message||''));
      }
      restoreInput.value = '';
    };
    reader.readAsText(f);
  };

  const warnEl = document.getElementById('storageWarn');
  if(Store.mode === 'none'){
    warnEl.style.color = 'var(--rust)';
    warnEl.textContent = '⚠ Automatisches Speichern nicht verfügbar – bitte "Sicherung ↓" nutzen.';
  } else if(Store.mode === 'local'){
    warnEl.style.color = 'var(--emerald)';
    warnEl.textContent = '✓ Wird automatisch in diesem Browser gespeichert.';
  } else {
    warnEl.style.color = 'var(--ink-soft)';
    warnEl.textContent = '';
  }

  const appTitleEl = document.getElementById('appTitle');
  if(state.appTitle) appTitleEl.textContent = state.appTitle;
  document.title = appTitleEl.textContent;
  appTitleEl.oninput = () => {
    state.appTitle = appTitleEl.textContent.trim() || 'Organization';
    document.title = state.appTitle;
    save();
  };
}
init();
</script>
